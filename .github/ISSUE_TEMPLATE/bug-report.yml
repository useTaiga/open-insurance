name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: "Use fictional data only. Do not attach patient records, credentials, signed personal passes or captures. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Commit or package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Bun, operating system, and hardware model if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands or steps with a minimal fictional example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
