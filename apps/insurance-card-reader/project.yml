name: InsuranceReader
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ReaderCore:
    path: ReaderCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  InsuranceReader:
    type: application
    platform: iOS
    sources:
      - Reader
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openinsurance.reader.demo
        INFOPLIST_FILE: Reader/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Reader/Reader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
